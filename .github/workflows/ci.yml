name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: poemhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint checks
        run: pnpm lint

      - name: Generate route types & Typecheck
        run: pnpm exec next typegen && pnpm typecheck

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/poemhub_test
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/poemhub_test
          AUTH_SECRET: ci-dummy-auth-secret-string-at-least-32-chars-long
          RESEND_API_KEY: re_dummy_key_for_ci_checks_only
          EMAIL_FROM: "InkBoard CI <ci@example.com>"
          APP_URL: http://localhost:3000
        run: pnpm test

      - name: Build Next.js
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/poemhub_test
          AUTH_SECRET: ci-dummy-auth-secret-string-at-least-32-chars-long
          RESEND_API_KEY: re_dummy_key_for_ci_checks_only
          EMAIL_FROM: "InkBoard CI <ci@example.com>"
          APP_URL: http://localhost:3000
        run: pnpm build
